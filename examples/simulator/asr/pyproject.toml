[project]
name = "aurigin-asr-simulator-service"
version = "0.0.0"
description = "Minimal deterministic gRPC simulator for aurigin Transcription.Transcribe."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    # Consumed by the generated stubs the server responds with. Aligned with
    # the aurigin-protos version this repo publishes; bump in lockstep on
    # each aurigin-protos release. `aurigin.asr.v1` package first appears
    # in aurigin-protos 0.3.7+.
    "aurigin-protos>=0.3.7",
    "grpcio>=1.62",
    # No pyyaml / jsonschema — ASR simulator is deliberately scenario-less.
    # Turn text is drawn deterministically from a fixed vocabulary cycled by
    # turn index, so the same input always produces the same transcripts on
    # any machine. Add a scenario system if / when transcript-behaviour
    # tests need it.
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
# `uv run asr-simulator-service` and the Docker ENTRYPOINT both land here.
asr-simulator-service = "asr_simulator_service.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asr_simulator_service"]
