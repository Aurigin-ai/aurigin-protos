[project]
name = "aurigin-replay-simulator-service"
version = "0.0.0"
description = "Minimal deterministic gRPC simulator for aurigin ReplayDetection.DetectReplay."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    # Consumed by the generated stubs the server responds with. Aligned with
    # the aurigin-protos version this repo publishes; bump in lockstep on
    # each aurigin-protos release. `replay_detection.v1` package first
    # appears in aurigin-protos 0.3.3+.
    "aurigin-protos>=0.3.3",
    "grpcio>=1.62",
    # No pyyaml / jsonschema — replay simulator is deliberately
    # scenario-less. Scores are derived deterministically from the audio
    # payload so the same input always produces the same score + label
    # on any machine (useful for smoke tests + fixture diffs). Add a
    # scenario system if / when score-behaviour tests need it.
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
# `uv run replay-simulator-service` and the Docker ENTRYPOINT both land here.
replay-simulator-service = "replay_simulator_service.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/replay_simulator_service"]
