[project]
name = "aurigin-deepfake-simulator-service"
version = "0.0.0"
description = "Scenario-driven gRPC simulator for aurigin DeepfakeDetection.DetectDeepfake."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    # Consumed by the generated stubs the server responds with. Aligned with
    # the aurigin-protos version this repo publishes; bump in lockstep on
    # each aurigin-protos release. The pin uses the public PyPI package;
    # dev runs use the locally-generated gen/py/ tree via PYTHONPATH so this
    # pin doesn't actually gate local iteration.
    "aurigin-protos>=0.3.0",
    "grpcio>=1.62",
    # Scenario file parsing (YAML) + schema validation. Runtime deps of the
    # `sim` subpackage — kept alongside the server since the whole point
    # of the service is to serve scenario-shaped responses.
    "pyyaml>=6.0",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
# `uv run deepfake-simulator-service` and the Docker ENTRYPOINT both land here.
deepfake-simulator-service = "deepfake_simulator_service.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deepfake_simulator_service"]
