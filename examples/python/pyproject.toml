[project]
name = "aurigin-protos-examples"
version = "0.0.0"
description = "Reference client examples for aurigin-protos. The scenario-driven simulator server lives at examples/simulator/deepfake/."
requires-python = ">=3.10"
dependencies = [
    "aurigin-protos>=0.3.0",
    "grpcio>=1.62",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

# Mirrors the TypeScript example's `npm run client` / etc. After `uv sync`,
# run with `uv run client` / `uv run phone-call` / `uv run phone-call-burst`.
# The scenario-driven server was extracted to `examples/simulator/deepfake/`;
# see that directory for `uv run deepfake-simulator-service`.
[project.scripts]
client = "client:cli"
phone-call = "phone_call:cli"
phone-call-burst = "phone_call_burst:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = [
    "client.py", "phone_call.py", "phone_call_burst.py",
    "common",
]

# aurigin-protos resolves from public PyPI by default — no extra index, no
# auth. Aurigin engineers who need a pre-promotion (release-candidate) version
# from the internal AWS CodeArtifact mirror should configure their uv index
# separately; see infra/aws/ in the repo for the connection details.
