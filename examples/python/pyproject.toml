[project]
name = "aurigin-protos-examples"
version = "0.0.0"
description = "Reference client examples for aurigin-protos. The scenario-driven simulator server lives at examples/simulator/deepfake/."
requires-python = ">=3.10"
dependencies = [
    # Pin bumps per package addition:
    #   0.3.2  — aurigin.client.v1 (AudioVerification), consumed by orchestrator_client
    #   0.3.3  — aurigin.replay_detection.v1, consumed by replay_client
    #   0.3.4  — aurigin.recording.v1, consumed by recording_client
    "aurigin-protos>=0.3.4",
    "grpcio>=1.62",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

# Mirrors the TypeScript example's `npm run client` / etc. After `uv sync`,
# run with `uv run client` / `uv run phone-call` / `uv run phone-call-burst` /
# `uv run scan-file`. The scenario-driven server was extracted to
# `examples/simulator/deepfake/`; see that directory for
# `uv run deepfake-simulator-service`.
[project.scripts]
client = "client:cli"
phone-call = "phone_call:cli"
phone-call-burst = "phone_call_burst:cli"
scan-file = "scan_file:cli"
# Fingerprint client — targets `aurigin.fingerprint.v1.Fingerprint`
# (pair with `examples/simulator/fingerprint/` for local runs).
fingerprint-client = "fingerprint_client:cli"
# Orchestrator client — targets `aurigin.client.v1.AudioVerification`
# (pair with `examples/simulator/orchestrator/` for local runs).
orchestrator-client = "orchestrator_client:cli"
# Replay-detection client — targets `aurigin.replay_detection.v1.ReplayDetection`
# (pair with `examples/simulator/replay/` for local runs).
replay-client = "replay_client:cli"
# Recording client — targets `aurigin.recording.v1.Recording`
# (pair with `examples/simulator/recording/` for local runs).
recording-client = "recording_client:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = [
    "client.py", "phone_call.py", "phone_call_burst.py", "scan_file.py",
    "fingerprint_client.py",
    "orchestrator_client.py",
    "replay_client.py",
    "recording_client.py",
    "common",
]

# aurigin-protos resolves from public PyPI by default — no extra index, no
# auth. Aurigin engineers who need a pre-promotion (release-candidate) version
# from the internal AWS CodeArtifact mirror should configure their uv index
# separately; see infra/aws/ in the repo for the connection details.
