syntax = "proto3";

package aurigin.deepfake_detection.v1;

import "aurigin/media/v1/audio_frame.proto";
import "twilio/tme/extensions/common/v1/audio_buffer.proto";

// Deepfake Detection Service.
//
// Analyzes a continuous audio stream and emits deepfake detection results.
// Audio is sent as raw PCM buffers and analyzed in rolling windows.
//
// Session Lifecycle:
//   1. Client sends CreateSessionRequest with optional configuration
//   2. Server responds with CreateSessionResponse containing session_id
//   3. Client streams AudioBuffer messages continuously
//   4. Server emits AnalysisResult events as each window is analyzed
//   5. On stream end, server emits a FinalResult with aggregate stats
//
service DeepfakeDetection {
  // Bidirectional streaming RPC for real-time deepfake detection.
  rpc DetectDeepfake(stream DetectDeepfakeRequest) returns (stream DetectDeepfakeResponse);
}

// ============================================================================
// Request (Client -> Server)
// ============================================================================

message CreateSessionRequest {
  // Optional session configuration; server applies defaults for unset fields.
  optional DetectionConfig config = 1;
}

message DetectDeepfakeRequest {
  oneof request {
    CreateSessionRequest create_session_request = 1;
    // DEPRECATED as of 0.3.0 — use `audio_frame` instead. Kept so
    // existing consumers of aurigin-protos 0.2.x continue to work
    // during the migration window. Scheduled for removal in 0.4.0
    twilio.tme.extensions.common.v1.AudioBuffer audio = 2 [deprecated = true];
    // Aurigin-native self-describing audio frame — codec + sample rate
    // + channels ride on the message so no session-open coordination
    // is needed. New clients should populate this field; the deepfake
    // service accepts either shape.
    aurigin.media.v1.AudioFrame audio_frame = 3;
  }
}

// ============================================================================
// Response (Server -> Client)
// ============================================================================

message DetectDeepfakeResponse {
  oneof response {
    CreateSessionResponse create_session_response = 1;
    AnalysisResult analysis_result = 2;
    FinalResult final_result = 3;
  }
}

message CreateSessionResponse {
  // Unique identifier for this session.
  string session_id = 1;
}

// ============================================================================
// Configuration
// ============================================================================

message DetectionConfig {
  // How many seconds of audio to accumulate before running analysis (default: 5.0).
  optional float analysis_interval_s = 1;
  // Model version to use, e.g. "stable" or "dev-v4" (default: server default).
  optional string model_version = 2;
  // Per-session VAD (voice-activity detection) gate. Unspecified = follow
  // server default (typically VAD_MODE_ON — silence windows skip inference,
  // saves GPU on hold-music / dead-air). Set VAD_MODE_OFF to force the
  // model to score every window regardless of speech content — useful for
  // offline batch scans of speech-heavy audio where the VAD's CPU cost
  // outweighs its silence-skip savings, and for benchmark runs that need
  // a stable model-only inference floor.
  optional VadMode vad_mode = 3;
  // Per-session VAD silence-skip threshold, in percent [0, 100]. A window
  // is skipped (label="silence") if its detected silence fraction meets or
  // exceeds this value. Only meaningful when vad_mode is unset or ON.
  // Unspecified = follow server env default (SILENCE_THRESHOLD_PCT, typically 80).
  // Lowering skips more windows (faster, risks missing short speech
  // utterances — accuracy trade-off); raising analyses more content
  // (slower, no accuracy loss).
  optional float vad_silence_threshold_pct = 4;
  // Per-session policy for the sub-window residual at stream end.
  // Unspecified = follow server env default (TAIL_STRATEGY, typically DROP).
  //   DROP     — residual silently skipped. Accuracy-first: a 5-s-trained
  //              model can misfire on a 1-2s partial window. Recommended
  //              for offline file scans.
  //   EXTEND   — fold residual into the prior window (its duration_ms
  //              grows). Coverage-first, no extra inference. Recommended
  //              for live calls where every second matters.
  //   RECOMPUTE — slide last window back to end-of-stream so it stays
  //              exactly analysis_interval_s long. HTTP /predict parity;
  //              one extra inference per session.
  optional TailStrategy tail_strategy = 5;
  // Per-session floor on residual duration eligible for its own inference,
  // in seconds. Interacts with tail_strategy: residuals shorter than this
  // are handled per-strategy rather than scored directly. Unspecified =
  // follow server env default (MIN_ANALYSIS_DURATION_S, typically 1.0).
  // The wav2vec2 feature extractor's kernel-size-3 conv needs at least
  // ~1 s of audio to produce enough feature frames; setting this lower
  // will break inference on short residuals.
  optional float min_analysis_duration_s = 6;
}

// VAD (voice-activity detection) per-session mode. Controls whether the
// silence-gate runs before model inference. UNSPECIFIED = follow the
// server's env-driven default (VAD_ENABLED); ON / OFF override it.
enum VadMode {
  VAD_MODE_UNSPECIFIED = 0;
  VAD_MODE_ON = 1;
  VAD_MODE_OFF = 2;
}

// Per-session tail strategy. Mirrors deepfake-service's server-side
// TailStrategy enum. UNSPECIFIED = follow the server's env-driven default
// (TAIL_STRATEGY, typically DROP).
enum TailStrategy {
  TAIL_STRATEGY_UNSPECIFIED = 0;
  TAIL_STRATEGY_DROP        = 1;
  TAIL_STRATEGY_EXTEND      = 2;
  TAIL_STRATEGY_RECOMPUTE   = 3;
}

// ============================================================================
// Analysis events
// ============================================================================

// Emitted each time a window of audio has been analyzed.
message AnalysisResult {
  // Audio offset from stream start (ms) - start of analyzed segment.
  int64 audio_offset_ms = 1;
  // Duration of the analyzed segment (ms).
  int64 duration_ms = 2;
  // Deepfake probability score [0-1]: 0.0 = fully bonafide, 1.0 = fully spoofed.
  float score = 3;
  // Human-readable classification. Decision values: "bonafide", "spoofed",
  // "partially_spoofed". Sentinel values (emitted when no decision was made):
  //   - "silence": the VAD gate suppressed inference because the window was
  //     classified non-speech. `score` is 0.0 and `confidence` carries the
  //     silence fraction (≈silence_pct/100) so clients can render gradations.
  //   - "error":   per-window inference failed; treat as non-actionable.
  // Clients should accept and forward unknown label strings rather than
  // failing — new sentinel values may be added without a wire break.
  string label = 4;
  // Model confidence in this classification [0-1]. For "silence" sentinels
  // this carries the VAD silence fraction; for "error" sentinels this is 0.0.
  float confidence = 5;
}

// Emitted once when the client closes the stream.
message FinalResult {
  // Total audio received (ms).
  int64 total_audio_ms = 1;
  // Average deepfake score across all analyzed windows [0-1].
  float overall_score = 2;
  // Aggregate classification: "bonafide", "spoofed", or "partially_spoofed".
  string overall_label = 3;
  // Number of analysis windows completed.
  int32 analysis_count = 4;
}
