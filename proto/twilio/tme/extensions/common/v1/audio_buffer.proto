syntax = "proto3";

package twilio.tme.extensions.common.v1;

option java_multiple_files = true;
option java_outer_classname = "AudioBufferProto";
option java_package = "com.twilio.tme.extensions.common.v1";

// Vendored copy of Twilio's AudioBuffer message used by Twilio Media
// Extensions. Kept here so Aurigin services that consume Twilio media
// streams can import it as a stable, locally-published proto.
//
// DEPRECATED as of aurigin-protos 0.3.0. New Aurigin-originated media
// streams should use `aurigin.media.v1.AudioFrame`, which is
// self-describing (codec + sample rate + channels on the message) and
// avoids the free-form `format` string this message carries. This file
// is retained for backwards compatibility with 0.2.x consumers and is
// scheduled for removal in 0.4.0. See docs/audioframe-rollout-plan.md
// in platform-backend-services.
message AudioBuffer {
  option deprecated = true;
  // audio type, always "audio/x-raw"
  string type = 1;
  // audio format, i.e. S16LE
  string format = 2;
  // number of channels
  int32 channels = 3;
  // bitrate
  int32 rate = 4;
  // duration of this buffer in nanoseconds
  uint64 duration_ns = 5;
  // presentation timestamp of this buffer in nanoseconds
  uint64 pts_ns = 6;
  // size of the audio data
  uint64 size = 7;
  // the audio data
  bytes buffer = 8;
}
