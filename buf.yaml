version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  except:
    # Service is `DeepfakeDetection`, not `DeepfakeDetectionService`.
    # Renaming would be a wire break for every current consumer; the
    # suffix rule stays disabled until we intentionally cut a wire
    # version that renames the service.
    - SERVICE_SUFFIX
breaking:
  use:
    - FILE
    # Allow fields to be retired via `reserved N;` — the strict
    # FIELD_NO_DELETE rule in FILE blocks even reserve-then-delete,
    # so swap it for the permissive variant that enforces the
    # standard proto retire-with-reserved pattern.
    - FIELD_NO_DELETE_UNLESS_NUMBER_RESERVED
  except:
    - FIELD_NO_DELETE
