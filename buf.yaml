version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  except:
    # Service is `DeepfakeDetection`, not `DeepfakeDetectionService`.
    # Renaming would be a wire break for every current consumer; the
    # suffix rule stays disabled until we intentionally cut a wire
    # version that renames the service.
    - SERVICE_SUFFIX
breaking:
  use:
    - FILE
