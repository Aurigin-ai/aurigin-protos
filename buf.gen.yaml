version: v2

plugins:
  # ---- Python: messages + gRPC service stubs (remote plugins from buf.build) ----
  # Pinned to specific plugin versions — buf.build's remote-plugin
  # execution now rate-limits (and 403s) unpinned `:latest` references
  # from CI runners, while pinned versions stay cache-hittable and
  # anonymous. Bump these on protobuf / grpcio releases we care about.
  - remote: buf.build/protocolbuffers/python:v29.3
    out: gen/py
  - remote: buf.build/grpc/python:v1.66.0
    out: gen/py

  # ---- TypeScript: ts-proto, gRPC-JS compatible (local plugin from gen/ts node_modules) ----
  - local: gen/ts/node_modules/.bin/protoc-gen-ts_proto
    out: gen/ts/src
    opt:
      - outputServices=grpc-js
      - esModuleInterop=true
      - env=node
      - useOptionals=messages
      - exportCommonSymbols=false
      # Required for NodeNext module resolution: relative imports must end in .js
      - importSuffix=.js
      # int64/uint64 -> bigint (default `number` truncates values above 2^53)
      - forceLong=bigint
