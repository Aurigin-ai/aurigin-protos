[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aurigin-protos"
version = "0.0.0"
description = "Generated gRPC Python stubs for Aurigin services (DeepfakeDetection + shared media types)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = [
    "grpc",
    "protobuf",
    "aurigin",
    "deepfake",
    "deepfake-detection",
    "audio",
    "voice-authenticity",
]
authors = [
    { name = "Aurigin.ai", email = "security@aurigin.ai" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "grpcio>=1.62",
    "protobuf>=4.25",
]

[project.urls]
Homepage       = "https://github.com/Aurigin-ai/aurigin-protos"
Source         = "https://github.com/Aurigin-ai/aurigin-protos"
"Bug Tracker"  = "https://github.com/Aurigin-ai/aurigin-protos/issues"
Changelog      = "https://github.com/Aurigin-ai/aurigin-protos/releases"
Documentation  = "https://github.com/Aurigin-ai/aurigin-protos#readme"
Examples       = "https://github.com/Aurigin-ai/aurigin-protos/tree/main/examples"

[tool.hatch.build.targets.wheel]
packages = ["aurigin", "twilio"]
